<!DOCTYPE html>
<html>

<head>
    <title>DevOps Training App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f4f6f9;
        }

        .card {
            background: white;
            padding: 30px;
            display: inline-block;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #2c3e50;
        }

        .badge {
            background: #3498db;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.9em;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>🚀 DevOps Training Web App</h1>

        <p>
            Current Environment:
            <span class="badge">{{ env }}</span>
        </p>

        <p>
            Status: <strong>Online & Running!</strong>
        </p>
    </div>
</body>

</html>
